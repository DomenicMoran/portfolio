name: Prüfen

# Warum es diesen Workflow gibt: Das Repository verkauft Prüfdisziplin. Ohne
# ein Tor, das dieselben Befehle ausführt, die in AGENTS.md als Definition of
# Done stehen, wäre das eine Behauptung. Der Audit hat genau das angemerkt.
#
# Bewusst kein Test-Schritt: Es gibt hier keine Testsuite. Ein Schritt, der
# nichts prüft und trotzdem grün meldet, ist schlimmer als kein Schritt.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Typen
        run: npx tsc --noEmit

      - name: Linter
        run: npx eslint .

      # Der Bau ist der eigentliche Beleg: Er erzeugt jede Route statisch und
      # scheitert, sobald eine Übersetzung fehlt, weil en.ts gegen denselben
      # Typ deklariert ist wie die deutsche Fassung.
      - name: Bau
        run: npm run build

      # Lesezeit vor dem Browser, weil sie ihn nicht braucht: reine Zählung
      # gegen die angegebene Minutenzahl je Artikel.
      - name: Lesezeiten
        run: npm run check:reading

      # Chromium nur, wenn er gebraucht wird — die beiden folgenden Schritte
      # messen an der gebauten Seite, nicht am Quelltext.
      - name: Chromium
        run: npx playwright install --with-deps chromium

      # axe-core gegen jede gebaute Seite, zwei Breiten. Es prüft rund hundert
      # Regeln auf einmal und findet damit auch, wonach hier noch niemand
      # gesucht hat.
      - name: Barrierefreiheit
        run: npm run check:a11y

      # Die Datenschutzerklärung sagt als Tatsache, dass keine Verbindung nach
      # außen aufgebaut wird. Diese Aussage bricht leise — eine Schrift von
      # einem CDN, ein Video, ein Zählpixel.
      # Reine Rechenlogik ohne Browser: die Zeitspanne, aus der „vier Monate"
      # wird. Ein Fehler um eins sieht auf der Seite normal aus.
      - name: Tests
        run: npm test

      - name: Datenschutz
        run: npm run check:privacy

      # Ein Anker ohne Ziel springt nirgendwohin, und der Browser meldet
      # nichts. Betrifft Kopfleiste, Fußzeile, 404-Seite und jeden Beleg im
      # Recruiter-Bereich.
      - name: Verweise
        run: npm run check:links

      # vercel.json wird vom Bau nicht gelesen: Ein Tippfehler im Schlüssel
      # oder eine Änderung über die Weboberfläche fällt nirgends auf.
      # Gemessen wird deshalb die Antwort der Live-Adresse.
      #
      # Und genau deshalb nicht auf Pull Requests: Der Lauf misst, was gerade
      # ausgeliefert wird, nicht den Stand des Zweigs. Ein Pull Request könnte
      # sonst grün werden, obwohl er die Kopfzeilen zerschießt, und rot, obwohl
      # er nichts damit zu tun hat.
      - name: Schutz-Kopfzeilen der Auslieferung
        if: github.event_name != 'pull_request'
        run: npm run check:headers

      # Der Ausdruck ist ein eigener Auslieferungsweg, den sonst niemand
      # ansieht: Die Startseite kam einmal als 15 fast leere Seiten aus dem
      # Drucker, weil die Einblendungen auf ein Hineinscrollen warten, das
      # beim Drucken nie stattfindet.
      - name: Druckbild
        run: npm run check:print

      # Unterlängen: g, y und p standen unten angeschnitten in den
      # Masken-Reveals, weil die Zeilenbox knapper war als die Schrift.
      - name: Unterlängen
        run: npm run check:headings
