name: Prüfen

# Warum es diesen Workflow gibt: Das Repository verkauft Prüfdisziplin. Ohne
# ein Tor, das dieselben Befehle ausführt, die in AGENTS.md als Definition of
# Done stehen, wäre das eine Behauptung. Der Audit hat genau das angemerkt.
#
# Bewusst kein Test-Schritt: Es gibt hier keine Testsuite. Ein Schritt, der
# nichts prüft und trotzdem grün meldet, ist schlimmer als kein Schritt.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Typen
        run: npx tsc --noEmit

      - name: Linter
        run: npx eslint .

      # Der Bau ist der eigentliche Beleg: Er erzeugt jede Route statisch und
      # scheitert, sobald eine Übersetzung fehlt, weil en.ts gegen denselben
      # Typ deklariert ist wie die deutsche Fassung.
      - name: Bau
        run: npm run build

      # Lesezeit vor dem Browser, weil sie ihn nicht braucht: reine Zählung
      # gegen die angegebene Minutenzahl je Artikel.
      - name: Lesezeiten
        run: npm run check:reading

      # Chromium nur, wenn er gebraucht wird — die folgenden Schritte messen
      # an der gebauten Seite, nicht am Quelltext.
      #
      # Und aus dem Zwischenspeicher, weil der Download der eigentliche Posten
      # ist: Ein Lauf am 03.08.2026 brauchte dafür 631 s bei 1.049 s Gesamtzeit,
      # während die acht Läufe davor zusammen bei 306 bis 340 s lagen. Der
      # Schlüssel trägt die Playwright-Fassung: Ein Wechsel lädt neu, alles
      # andere greift auf dasselbe Verzeichnis zu.
      - name: Playwright-Fassung ermitteln
        id: pw
        run: echo "version=$(node -p "require('./package-lock.json').packages['node_modules/playwright'].version")" >> "$GITHUB_OUTPUT"

      - name: Chromium aus dem Zwischenspeicher
        id: pw-cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}

      # Bei einem Treffer fehlen nur die Systembibliotheken; das Browserpaket
      # selbst liegt schon da.
      - name: Chromium
        run: |
          if [ "${{ steps.pw-cache.outputs.cache-hit }}" = "true" ]; then
            npx playwright install-deps chromium
          else
            npx playwright install --with-deps chromium
          fi

      # axe-core gegen jede gebaute Seite, zwei Breiten. Es prüft rund hundert
      # Regeln auf einmal und findet damit auch, wonach hier noch niemand
      # gesucht hat.
      - name: Barrierefreiheit
        run: npm run check:a11y

      # Die Datenschutzerklärung sagt als Tatsache, dass keine Verbindung nach
      # außen aufgebaut wird. Diese Aussage bricht leise — eine Schrift von
      # einem CDN, ein Video, ein Zählpixel.
      # Reine Rechenlogik ohne Browser: die Zeitspanne, aus der „vier Monate"
      # wird. Ein Fehler um eins sieht auf der Seite normal aus.
      - name: Tests
        run: npm test

      - name: Datenschutz
        run: npm run check:privacy

      # Ein Anker ohne Ziel springt nirgendwohin, und der Browser meldet
      # nichts. Betrifft Kopfleiste, Fußzeile, 404-Seite und jeden Beleg im
      # Recruiter-Bereich.
      - name: Verweise
        run: npm run check:links

      # Die Typen erzwingen, dass jedes Feld übersetzt ist — nicht, dass am
      # Ende gleich viel gerendert wird. Ein Eintrag, der nur in einer Liste
      # steht, kommt durch den Typecheck.
      - name: Gleichstand der Sprachfassungen
        run: npm run check:parity

      # vercel.json wird vom Bau nicht gelesen: Ein Tippfehler im Schlüssel
      # oder eine Änderung über die Weboberfläche fällt nirgends auf.
      # Gemessen wird deshalb die Antwort der Live-Adresse.
      #
      # Und genau deshalb nicht auf Pull Requests: Der Lauf misst, was gerade
      # ausgeliefert wird, nicht den Stand des Zweigs. Ein Pull Request könnte
      # sonst grün werden, obwohl er die Kopfzeilen zerschießt, und rot, obwohl
      # er nichts damit zu tun hat.
      - name: Schutz-Kopfzeilen der Auslieferung
        if: github.event_name != 'pull_request'
        run: npm run check:headers

      # Der Ausdruck ist ein eigener Auslieferungsweg, den sonst niemand
      # ansieht: Die Startseite kam einmal als 15 fast leere Seiten aus dem
      # Drucker, weil die Einblendungen auf ein Hineinscrollen warten, das
      # beim Drucken nie stattfindet.
      - name: Druckbild
        run: npm run check:print

      # Unterlängen: g, y und p standen unten angeschnitten in den
      # Masken-Reveals, weil die Zeilenbox knapper war als die Schrift.
      - name: Unterlängen
        run: npm run check:headings

      # Wer mit einem Vorleseprogramm arbeitet, springt durch Landmarken.
      # Dreimal fehlte eine, jedes Mal von Hand gefunden: der Belegblock der
      # Artikel, die Artikelliste, zuletzt die Rechtsseiten und beide
      # Kurzprofile. axe prüft, ob eine vorhandene Landmarke richtig gebaut
      # ist, nicht, ob sie da ist.
      - name: Landmarken
        run: npm run check:landmarks

      # Ein Mittelpunkt, der beim Umbruch am Zeilenende hängen bleibt, trennt
      # nichts mehr. Auf zehn Artikelseiten und dem Kurzprofil war das so;
      # gesehen hat es keiner der anderen Läufe, weil es weder ein Verstoß
      # noch ein toter Verweis ist, sondern ein Satzfehler.
      - name: Trennzeichen
        run: npm run check:separators

      # „EU AI Act Art." am Zeilenende und „50" auf der nächsten — gefunden auf
      # der Startseite bei 390 px und auf /en bei 320 px. Dieselbe Klasse wie
      # der Trennpunkt darunter, und ebenso wenig von einem anderen Lauf zu
      # sehen.
      - name: Geschützte Leerzeichen
        run: npm run check:nbsp

      # Die beiden PDFs entstehen nicht beim Bau — dafür bräuchte der Lauf ein
      # Chromium mit Druckfunktion. Sie werden von Hand gedruckt, und ein
      # Schritt von Hand wird irgendwann vergessen. Ausgerechnet diese Datei
      # reicht ein Recruiter weiter.
      - name: Stand des Kurzprofils
        run: npm run check:onepager

      # Deutsch und Englisch setzen dieselben Zeichen anders: „so" gegen "so",
      # 100 % gegen 100%. Auf der englischen Fassung standen zehn deutsche
      # Anführungszeichen, und kein Lauf sah sie, weil keiner danach sah.
      - name: Typografie je Sprache
        run: npm run check:typography

      # Das Datum der Datenschutzerklaerung wird von Hand gepflegt, damit sie
      # sich nicht taeglich selbst neu datiert. Von Hand heisst aber auch:
      # Es kann stehen bleiben, waehrend der Text weiterwandert.
      - name: Stand der Datenschutzerklärung
        run: npm run check:legal

      # Ein `export` ist die Aussage, dass etwas woanders gebraucht wird. Sechs
      # davon stimmten nicht — nichts war kaputt, es war nur sechsmal eine
      # falsche Faehrte fuer jeden, der den Quelltext liest.
      - name: Ausfuhren mit Abnehmer
        run: npm run check:exports

      # README.md und AGENTS.md zählen Dinge, und gezählte Dinge veralten leise.
      # Gefunden beim Lesen: eine Ankündigung von drei Regeln über vier Punkten,
      # dreizehn genannte Prüfungen bei vierzehn aufgezählten und ein
      # Verzeichnisbaum, der 13 von 22 Skripten kannte.
      - name: Handbuch gegen das Repo
        run: npm run check:docs

      # Ladeverhalten verschlechtert sich in kleinen Schritten, jeder fuer sich
      # vertretbar. Der Lauf misst auf einem gedrosselten Telefon und haelt LCP
      # und CLS gegen ihre Budgets. Er steht am Ende, weil er als einziger
      # Zeit braucht: vier Seiten mal drei kalte Laeufe.
      #
      # Auf einem geteilten Runner streuen solche Messungen staerker als auf
      # einem ruhigen Rechner. Die Budgets sind deshalb die ueblichen Schwellen
      # und nicht enger: Ein Lauf, der bei jeder zweiten Auslieferung rot wird,
      # wird abgeschaltet statt gelesen.
      - name: Kernwerte auf dem Telefon
        run: npm run check:vitals

      # Das Budget schlägt früher an als die Kernwerte: Es meldet den Zuwachs,
      # nicht erst die Folge. Braucht nur den Bau, kein Netz, keinen Browser —
      # und stand nach dem Anlegen trotzdem in keinem Workflow.
      - name: Bündelbudget je Seite
        run: npm run check:bundle

      # Karten in einem Raster sind gleich hoch, ihre Überschriften nicht.
      # Braucht eine zwei Zeilen und die daneben eine, beginnt der Text 22 px
      # versetzt. Auf einem Bildschirmfoto sieht man es sofort, in keinem Log.
      - name: Kartenreihen auf einer Höhe
        run: npm run check:cards

      # Chrome bietet 20 und 24 px als Standardschrift in seinen Einstellungen
      # an. Anders als Zoom vergrößert das nur `rem` und `em`: Die Spalten
      # bleiben, die Wörter wachsen. Was dabei über die rechte Kante ragt,
      # klemmt `overflow-x: clip` ab — es entsteht keine Bildlaufleiste, der
      # Text ist weg. Gemessen waren es einmal 88 Stellen, sichtbar für
      # niemanden, der mit 16 px prüft.
      - name: Größere Grundschrift verträgt die Seite
        run: npm run check:font-size

      # WCAG 2.2 verlangt in 2.4.11, dass feste Bedienung den Fokus nicht
      # verdeckt. Das steht in keinem Dokument, das axe lesen könnte: Wer
      # tabbt, dem scrollt der Browser zum Ziel, ohne die feste Kopfleiste
      # mitzurechnen. Das Element hat dann den Fokus und liegt darunter.
      - name: Der Tastaturfokus bleibt sichtbar
        run: npm run check:focus

      # Die Fallstudien legen ihren Inhalt auf vier Reiter, sichtbar ist
      # immer nur einer. Ein Diagramm, dessen Schlüssel nicht mehr passt,
      # rendert nichts, und der Reiter darüber verspricht es weiter — der
      # Typecheck sieht das nicht, gemessen an einem verbogenen Schlüssel.
      - name: Tafeln hinter den Reitern
        run: npm run check:panels

      # Was die beiden Sprachfassungen zusammenhält, ist unsichtbar, solange
      # es stimmt: hreflang-Paare, der sichtbare Sprachwechsel und der Weg
      # zurück aus den Rechtsseiten, die es nur auf Deutsch gibt. Dazu
      # WCAG 3.1.2 — deutscher Text auf einer englischen Seite braucht eine
      # Auszeichnung, sonst spricht ein Vorleseprogramm ihn englisch aus.
      - name: Bindung der Sprachfassungen
        run: npm run check:language

      # Die Demo auf der Startseite behauptet etwas Nachprüfbares: sie prüfe
      # jede der 4.096 Zusammenstellungen und nehme die beste. Eine Demo, die
      # daneben liegt, sagt über den Erbauer das Gegenteil dessen, wofür sie
      # dasteht — und die Zahlen sehen in jedem Fall plausibel aus.
      - name: Die Demo rechnet nach
        run: npm run check:demo

      # Die Artikel zeigen Code als Beleg. Wer sie liest, liest Code — ein
      # Tippfehler in einem Ausschnitt wiegt für diesen Leser mehr als jede
      # Kennzahl daneben. Geprüft wird nur die Syntax: Die Blöcke sind
      # Ausschnitte ohne Importe, ein Typecheck fände dort nichts Echtes.
      - name: Codeblöcke der Artikel
        run: npm run check:code

      # Die strukturierten Daten sind die einzige Stelle, an der die
      # Kernangaben ein zweites Mal stehen — und die einzige, die niemand
      # sieht. Wer eine Fallstudie umbenennt oder ein Bild verschiebt, merkt
      # hier nichts, und die Seite erzählt einer Suchmaschine ab dann etwas
      # anderes als ihrem Leser.
      - name: Strukturierte Daten gegen die Seite
        run: npm run check:schema

      # Die Befehlspalette ist das einzige Bedienelement, das die ganze
      # Seite erschließt — und die Sorte Bauteil, die stumm versagt: Ihre
      # Liste kommt aus dem Inhalt, und verschiebt sich dort ein Schlüssel,
      # meldet sie „Nichts gefunden." Das sieht aus wie eine Antwort und
      # ist keine.
      - name: Die Befehlspalette findet
        run: npm run check:palette

      # Die eine Kennzahl der Seite, die auf ein fremdes Werkzeug zeigt:
      # „Lighthouse 100 Barrierefreiheit" steht unter den quelloffenen Paketen.
      # Der Schritt misst gegen die ausgelieferte Seite, nicht gegen den Bau —
      # eine Aussage über die Live-Adresse gehört auch dort geprüft.
      - name: Lighthouse gegen die Live-Adresse
        run: npm run check:lighthouse

      # Die genannte Technik gegen die Produktivrepos. Hier laufen die nicht
      # mit, der Schritt meldet das und überspringt — er steht trotzdem in der
      # Kette, damit die Liste vollständig ist und niemand ihn für vergessen
      # hält.
      - name: Genannte Technik
        run: npm run check:stack
