# Frischt die Commit-Zahlen auf der Webseite auf.
#
# Die Zahl auf domenicmoran.de kam bisher von einem Lauf auf dem Rechner: Sie
# stimmte im Moment der Messung und wurde mit jedem weiteren Commit älter. Das
# war kein Fehler, weil sie ihr Messdatum mitträgt — aber "immer aktuell" ist
# besser als "damals richtig".
#
# Warum hier und nicht im Browser des Besuchers: Fünf der elf Repositories
# sind privat, sie tragen Kundendaten und lizenzierte Inhalte. Sie öffentlich
# lesbar zu machen, nur damit eine Zahl live ist, wäre der falsche Tausch. Ein
# Token im ausgelieferten JavaScript wäre ein veröffentlichtes Token. Also
# liest ein Automat mit einem Token, das GitHub verwahrt, und liefert das
# Ergebnis aus.
#
# Am 16.08.2026 kamen BitDojo, Dartile und LexiPulse dazu. Die ersten beiden
# liegen unter dem persönlichen Konto und waren mit dem Token nicht lesbar;
# statt eines zweiten Tokens ist `MenuCloud-Berlin` dort jetzt Mitarbeiter mit
# Leserecht. Wer ein weiteres privates Repo aufnimmt, tut dasselbe, sonst
# scheitert der Lauf mit dem Namen des fehlenden Repos.
#
# Zwei Geheimnisse sind nötig, beide in den Repository-Einstellungen:
#   ZAHLEN_TOKEN   ein Token mit Leserecht auf die elf gezählten Repositories
#   VERCEL_TOKEN   ein Vercel-Token, damit die neue Zahl auch ausgeliefert wird
#
# Kein Deploy-Hook, obwohl das der einfachere Weg wäre: Ein Hook setzt eine
# Git-Anbindung des Vercel-Projekts voraus, und die gibt es hier bewusst nicht.
# Mit ihr lehnte Vercel Bauten ab, deren Commit-Autor nicht im Team ist — und
# der Autor wäre hier ein Automat. Also derselbe Weg wie von Hand: die CLI.
#
# Fehlt ein Geheimnis, bricht der Lauf nicht ab, sondern sagt was fehlt und
# lässt die Seite in Ruhe. Eine halbe Zahl wäre schlimmer als eine alte.

name: Zahlen auffrischen

on:
  schedule:
    # Täglich um 04:12 UTC. Eine krumme Minute, weil zur vollen Stunde die
    # halbe Welt gleichzeitig plant.
    - cron: "12 4 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  auffrischen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Token vorhanden?
        id: token
        env:
          TOKEN: ${{ secrets.ZAHLEN_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "ZAHLEN_TOKEN fehlt. Ohne Token sind die privaten Repositories"
            echo "nicht lesbar, und eine Teilsumme sähe aus wie die ganze Zahl."
            echo "Der Lauf endet ohne Änderung."
            echo "proceed=no" >> "$GITHUB_OUTPUT"
          else
            echo "proceed=yes" >> "$GITHUB_OUTPUT"
          fi

      - name: Zahlen holen
        if: steps.token.outputs.proceed == 'yes'
        env:
          GITHUB_TOKEN: ${{ secrets.ZAHLEN_TOKEN }}
        run: node scripts/fetch-figures-from-github.mjs

      - name: Änderung feststellen
        if: steps.token.outputs.proceed == 'yes'
        id: diff
        run: |
          if git diff --quiet src/content/verified.json; then
            echo "changed=no" >> "$GITHUB_OUTPUT"
          else
            echo "changed=yes" >> "$GITHUB_OUTPUT"
          fi

      # Die beiden Blätter tragen dieselben Zahlen — und ihren Monat.
      #
      # Das Kurzprofil nennt „Stand: August 2026" aus der Uhr des Baus, und es
      # nennt die Zahlen, die dieser Lauf gerade aufgefrischt hat. Beides steht
      # nur im HTML; die zwei PDF entstehen nicht beim Bau, weil Vercel dafür
      # kein Chromium hat.
      #
      # Damit veralteten sie zweimal ohne Zutun: bei jeder neuen Zahl und beim
      # ersten Lauf in einem neuen Monat. `check:onepager` meldete das
      # zuverlässig — und verlangte danach einen Handgriff am eigenen Rechner,
      # zu einem Zeitpunkt, den niemand geplant hatte.
      #
      # Hier gibt es Chromium. Also wird gedruckt, wo ohnehin gebaut wird.
      - name: Blätter neu drucken
        if: steps.diff.outputs.changed == 'yes'
        run: |
          npm ci
          npx playwright install --with-deps chromium
          npm run build
          npm run onepager:pdf

      - name: Einchecken
        if: steps.diff.outputs.changed == 'yes'
        run: |
          git config user.name "Zahlen-Automat"
          git config user.email "noreply@domenicmoran.de"
          git add src/content/verified.json public/domenic-moran-kurzprofil.pdf public/domenic-moran-one-pager.pdf
          git commit -m "Commit-Zahlen aufgefrischt

          Automatisch gezählt über die GitHub-API. Die Zahl auf der Seite trägt ihr
          Messdatum, damit sie auch zwischen zwei Läufen nicht falsch ist, sondern nur
          älter. Die beiden Kurzprofile sind mit derselben Zahl neu gedruckt."
          git push

      - name: Ausliefern
        if: steps.diff.outputs.changed == 'yes'
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          # Kennungen statt Geheimnisse: `.vercel/project.json` steht in der
          # .gitignore, die CLI wüsste hier sonst nicht, welches Projekt
          # gemeint ist. Die beiden Kennungen sind keine Zugangsdaten — ohne
          # Token nützen sie niemandem — und liegen deshalb als Variablen da.
          VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
        run: |
          if [ -z "$VERCEL_TOKEN" ]; then
            echo "VERCEL_TOKEN fehlt. Die Zahl steht im Repository, ist aber"
            echo "noch nicht ausgeliefert. Der nächste Deploy nimmt sie mit."
            exit 0
          fi

          # Der Fehlerfall braucht eine Anleitung — aber die richtige.
          #
          # Am 02.08.2026 scheiterte dieser Schritt zweimal an "The token
          # provided via --token argument is not valid". Am 04.08. scheiterte er
          # wieder, diesmal am Bau: `git ls-files` im prebuild findet bei Vercel
          # kein Repository, weil der Code dort als Archiv ankommt. Die Meldung
          # nannte trotzdem das Token, weil sie jeden Fehlschlag gleich behandelte.
          # Eine Anleitung, die auf den falschen Grund zeigt, kostet mehr Zeit als
          # gar keine: Sie wurde befolgt, und der Fehler blieb.
          #
          # Woran es lag, steht in der Ausgabe der CLI. Also wird sie gelesen.
          set -o pipefail
          if npx --yes vercel@latest deploy --prod --yes --token "$VERCEL_TOKEN" 2>&1 |
              tee "$RUNNER_TEMP/auslieferung.log"; then
            exit 0
          fi

          echo ""
          echo "::error::Die Auslieferung ist gescheitert. Die neue Zahl steht im Repository, aber nicht auf der Seite."
          echo ""

          if grep -qiE 'token .*(not valid|invalid)|invalid token|not authori[sz]ed|forbidden' \
              "$RUNNER_TEMP/auslieferung.log"; then
            echo "Grund: Vercel hat die Anmeldung abgelehnt. VERCEL_TOKEN ist abgelaufen oder ungültig."
            echo ""
            echo "So wird es behoben, drei Minuten:"
            echo "  1. vercel.com öffnen, oben rechts aufs Kontobild, Account Settings, Tokens"
            echo "  2. Create Token, Geltungsbereich Full Account, Ablauf No Expiration"
            echo "  3. github.com/DomenicMoran/portfolio, Settings, Secrets and variables,"
            echo "     Actions, bei VERCEL_TOKEN auf Update, neuen Wert einsetzen"
            echo "  4. Hier in Actions, Zahlen auffrischen, Run workflow — der Lauf muss grün sein"
            echo ""
            echo "Ein Token lässt sich nicht aus einer angemeldeten CLI-Sitzung erzeugen:"
            echo "Die Vercel-API antwortet darauf mit 403 Cannot create tokens for this app."
          else
            echo "Grund: Die Anmeldung hat gereicht, der Bau bei Vercel ist gescheitert."
            echo "Die Meldung steht oben im Protokoll dieses Schritts."
            echo ""
            echo "Bei Vercel liegt kein Repository — der Code kommt als Archiv an. Jeder"
            echo "Schritt, der Git voraussetzt, scheitert deshalb dort und nur dort."
            echo "Örtlich nachstellen, ohne Token und ohne Auslieferung:"
            echo "  npm run build"
          fi
          exit 1
