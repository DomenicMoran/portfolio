name: Produktion messen

# Zwei Messungen an der ausgelieferten Seite, einmal am Tag.
#
# Warum zeitgesteuert und nicht nur bei einem Push:
#
# Die Seite nennt unter „Core Web Vitals" einen Lighthouse-Cron gegen
# Produktion. Bis hierher gab es ihn nicht — `check:lighthouse` lief im
# Prüfworkflow, also nur, wenn jemand etwas ändert. Genau das ist aber der
# Fall, in dem ohnehin gemessen wird. Interessant ist die andere Richtung:
# Die ausgelieferte Seite verschlechtert sich, ohne dass jemand sie anfasst,
# weil ein Browser eine Regel verschärft oder eine Bewertung sich verschiebt.
#
# Gemessen wird deshalb an der Live-Adresse, einmal am Tag, ohne Bau. Der erste
# Schritt hält die Zahl „Lighthouse 100 Barrierefreiheit" gegen einen echten
# Lauf und liest sie aus dem Inhalt, statt sie zu wiederholen. Der zweite prüft
# die Zusage der Datenschutzerklärung dort, wo sie gilt.

on:
  schedule:
    # Täglich um 05:37 UTC, nach dem Auffrischen der Zahlen und zu einer
    # Minute, die sonst niemand nimmt.
    - cron: "37 5 * * *"
  workflow_dispatch:

jobs:
  messen:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Abhängigkeiten
        run: npm ci

      # Lighthouse startet Chrome selbst; der Lauf reicht ihm den von
      # Playwright mitgebrachten Browser.
      - name: Chromium
        run: npx playwright install --with-deps chromium

      - name: Lighthouse gegen die Live-Adresse
        run: npm run check:lighthouse

      # Die Datenschutzerklärung sagt: keine Cookies, keine fremden Skripte,
      # keine Verbindung nach außen. `check:privacy` belegte das bisher nur am
      # eigenen Server — und genau dort kann es nicht schiefgehen. Was auf der
      # Auslieferung dazukommt, sieht dieser Lauf nicht: Vercels Web Analytics
      # und Speed Insights lassen sich im Dashboard einschalten und werden dann
      # ohne Änderung am Repository in jede Seite geschrieben. Ein Klick, und
      # die Erklärung wäre falsch, ohne dass ein Commit es verrät.
      - name: Datenschutz an der Live-Adresse
        run: npm run check:privacy https://domenicmoran.de
